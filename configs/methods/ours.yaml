method:
  name: ours
  # Aggregation: current + module_alpha * (local - immutable downloaded base).
  # Raw sensitivity, reliability, frequency and EMA coefficients are unchanged.
  params:
    # Module-Gate: mean absolute gate magnitude, once per real optimizer step.
    sensitivity_warmup_steps: 1
    # C = (1-eta) + eta * raw/mean(raw); eta=0.75 gives a 0.25 floor.
    # Task-end layer selection automatically subtracts the same 0.25 floor.
    sensitivity_uniform_mix: 0.75
    gamma: 1.0
    # Accepted-update task-frequency correction over the latest W arrivals.
    frequency_window_size: 18
    frequency_power: 0.5
    frequency_min: 0.5
    frequency_max: 1.5
    history_beta: 0.9
    # Unknown H=1; first accepted C replaces it, later plain EMA (no bias correction).
    # Missing mode in immutable profiles retains zero-initialized corrected EMA.
    history_update_mode: first_observation_ema
    history_lambda: 1.0
    history_strength: 1.0
    # Freeze each task's final EMA; select above-mean Q/K/V/O layers.
    # SUM fixed-prior task demands on selected modules only; replace the old MAX.
    # Explicit selected_layers_max snapshots retain their original behavior.
    # Old snapshots missing mode retain all_modules_sum; false disables extra age.
    history_age_enabled: true
    history_age_mode: selected_layers_sum
    # Stronger ended-task extra protection; the base history and growth time stay unchanged.
    history_age_boost: 3.0
    history_age_time_scale: 18.0
    # Unit priors now live inside each unobserved task, not outside the task sum.
    base_precision: 0.0
    # alpha = rwC / (rwC + history_lambda*Omega + eps), no additional hard cap.
    # Old profiles missing alpha_max retain the historical 0.5 cap.
    alpha_max: null
    eps: 0.000000000001
    min_update_energy: 0.0000000000000001
federation:
  mode: asynchronous
