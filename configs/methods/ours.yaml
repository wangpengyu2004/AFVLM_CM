method:
  name: ours
  # Aggregation: current + module_alpha * (local - immutable downloaded base).
  # Raw sensitivity, reliability, frequency and EMA coefficients are unchanged.
  params:
    # Module-Gate: mean absolute gate magnitude, once per real optimizer step.
    sensitivity_warmup_steps: 1
    # C = (1-eta) + eta * raw/mean(raw); eta=0.5 gives a 0.5 floor.
    sensitivity_uniform_mix: 0.5
    gamma: 1.0
    # Accepted-update task-frequency correction over the latest W arrivals.
    frequency_window_size: 18
    frequency_power: 0.5
    frequency_min: 0.5
    frequency_max: 1.5
    history_beta: 0.9
    history_lambda: 1.0
    history_strength: 1.0
    # Freeze each task's final corrected EMA; select above-mean Q/K/V/O layers.
    # Add MAX task demand on selected modules only, never sum old age terms.
    # Old snapshots missing mode retain all_modules_sum; false disables extra age.
    history_age_enabled: true
    history_age_mode: selected_layers_max
    history_age_boost: 2.0
    history_age_time_scale: 18.0
    base_precision: 1.0
    alpha_max: 0.5
    eps: 0.000000000001
    min_update_energy: 0.0000000000000001
federation:
  mode: asynchronous
