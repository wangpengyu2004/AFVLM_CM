# 2026-11-02 design: probe warm-up + exact recent conflict + uniform eta*rho.
# Legacy/overlap_switch frozen profiles preserve their original algorithms.
method:
  name: ours_router
  params:
    rank_aggregation_mode: conflict_router
    # Each task keeps its last L accepted uploads; age is global accepted updates.
    conflict_per_task_window: 3
    conflict_max_age: 24
    # Engineering starting value from the design discussion, not a tuned optimum.
    conflict_penalty: 0.3
    conflict_min_norm: 0.000000000001
    # One coefficient for every uploaded module/component, no extra hard cap.
    server_step_size: 1.0
    # Full-rank probe also warms the private router. Task-balanced factor
    # averaging forms a common version-zero LoRA, outside the formal Plan.
    probe_local_epochs: 1
    capacity_energy_threshold: 0.95
    capacity_min_rank: 1
    capacity_max_rank: null
    # One private MLP per client AND Transformer layer. Q/K/V/O share only
    # within that layer. Keep the original input -> hidden32/SiLU -> scalar.
    # Missing router_sharing in old profiles preserves dimension sharing.
    router_sharing: layer
    router_hidden_size: 32
    router_learning_rate: 0.001
    router_label_beta: 0.9
    router_huber_delta: 1.0
    router_label_min: 0.000000000001
    router_max_grad_norm: 1.0
    sensitivity_warmup_steps: 1
    sensitivity_uniform_mix: 0.75
    gamma: 1.0
    eps: 0.000000000001
    min_update_energy: 0.0000000000000001
federation:
  mode: asynchronous
