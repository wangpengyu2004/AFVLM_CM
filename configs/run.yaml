# AFVLM-CM authoritative experiment configuration.
# Switch client scale/data imbalance with dataset.variant; select methods from
# the command line with --methods, without editing this file.
dataset:
  name: fixed_task_vlm
  variant: small_balanced
  root: data/fcit/fixed_task_benchmark
  image_root: data/fcit/dataset
  require_images: true

run:
  seeds: [42]
  output_root: auto

model:
  adapter: qwen25_vl
  hf_id: Qwen/Qwen2.5-VL-7B-Instruct
  dtype: bf16
  quantization: nf4
  gradient_checkpointing: true
  device_map: auto
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    include_visual: false
    target_modules: [q_proj, k_proj, v_proj, o_proj]

# tasks, clients.count, assignments and task-correlated delays are hydrated
# from the selected generated benchmark variant.
clients:
  upload_quota: 10

training:
  local_steps: 5
  batch_size: 1
  grad_accumulation: 4
  client_lr: 2.0e-4
  max_text_length: 2048

timing:
  clock: virtual
  train_delay: {type: fixed, value: 1.0}
  network_delay: {type: fixed, value: 0.0}

methods:
  - id: async_sgd
    implementation: async_additive
    enabled: false
    params: {server_lr: 0.5}
  - id: async_decay
    implementation: staleness_decay
    enabled: false
    params: {server_lr: 0.5, decay_exponent: 1.0}
  - id: fedavg
    implementation: fedavg_sync
    enabled: false
    params: {server_lr: 1.0, sample_weighted: true}
  - id: fedasync
    implementation: fedasync
    enabled: false
    params: {alpha: 0.5, decay_exponent: 0.5}
  - id: fedbuff
    implementation: fedbuff
    enabled: false
    params: {server_lr: 0.5, buffer_size: 8, flush_tail: true, sample_weighted: false}
  - id: fedadam
    implementation: fedadam_sync
    enabled: false
    params: {server_lr: 0.01, beta1: 0.9, beta2: 0.99, tau: 0.001, sample_weighted: true}
  - id: fedyogi
    implementation: fedyogi_sync
    enabled: false
    params: {server_lr: 0.01, beta1: 0.9, beta2: 0.99, tau: 0.001, sample_weighted: true}
  - id: fedcompass_sim
    implementation: fedcompass_sim
    enabled: false
    params:
      server_lr: 1.0
      buffer_size: 8
      min_local_steps: 1
      max_local_steps: 5
      flush_tail: true
      sample_weighted: true
  - id: afvlm_cm
    implementation: afvlm_cm
    enabled: true
    params:
      server_lr: 0.5
      staleness_exponent: 1.0
      download_correction: true
      download_strength: 0.1
      upload_correction: true
      memory_momentum: 0.9

experiments:
  - id: trace
    type: end_to_end
    enabled: true
    methods: all_enabled
    params:
      delay_scenarios: [task_correlated, task_shuffled]

evaluation:
  probe_samples_per_task: 16
  final_samples_per_task: 64
  window_size: 16
  save_update_norm: true
  probe_on_selected_events: true
  generation_on_selected_checkpoints: true

output:
  save_adapter: true
  save_method_state: true
  overwrite: false
