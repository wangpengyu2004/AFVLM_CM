# FCIT fixed-task benchmark. Change only dataset.variant to switch among all
# six client-scale/quantity variants; tasks and assignments are hydrated from
# the generated benchmark manifest before strict validation.
dataset:
  name: fcit_fixed
  variant: small_balanced
  root: data/fcit/fixed_task_benchmark
  image_root: data/fcit/dataset
  require_images: true

run:
  seeds: [42]
  output_root: auto

model:
  adapter: llava15_fcit
  hf_id: llava-hf/llava-1.5-7b-hf
  dtype: bf16
  quantization: nf4
  gradient_checkpointing: true
  device_map: auto
  mm_projector_lr: 2.0e-5
  mock_dimension: 3
  mock_step_size: 0.18
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    include_visual: false
    train_mm_projector: true
    target_modules: [q_proj, k_proj, v_proj, o_proj]

# count, data_partition, assignments and tasks are populated from dataset.variant.
clients:
  upload_quota: 10

training:
  local_steps: 5
  batch_size: 1
  grad_accumulation: 4
  client_lr: 2.0e-4
  max_text_length: 2048

timing:
  clock: virtual
  train_delay: {type: fixed, value: 1.0}  # replaced by variant task timings
  network_delay: {type: fixed, value: 0.0}

# Eight runnable baselines. Enable the methods wanted for one experiment batch.
methods:
  - id: async_sgd
    implementation: async_additive
    enabled: false
    params: {server_lr: 0.5}
  - id: async_decay
    implementation: staleness_decay
    enabled: false
    params: {server_lr: 0.5, decay_exponent: 1.0}
  - id: fedavg
    implementation: fedavg_sync
    enabled: false
    params: {server_lr: 1.0, sample_weighted: true}
  - id: fedasync
    implementation: fedasync
    enabled: true
    params: {alpha: 0.5, decay_exponent: 0.5}
  - id: fedbuff
    implementation: fedbuff
    enabled: false
    params: {server_lr: 0.5, buffer_size: 8, flush_tail: true, sample_weighted: false}
  - id: fedadam
    implementation: fedadam_sync
    enabled: false
    params: {server_lr: 0.01, beta1: 0.9, beta2: 0.99, tau: 0.001, sample_weighted: true}
  - id: fedyogi
    implementation: fedyogi_sync
    enabled: false
    params: {server_lr: 0.01, beta1: 0.9, beta2: 0.99, tau: 0.001, sample_weighted: true}
  - id: fedcompass_sim
    implementation: fedcompass_sim
    enabled: false
    params:
      server_lr: 1.0
      buffer_size: 8
      min_local_steps: 1
      max_local_steps: 5
      flush_tail: true
      sample_weighted: true

experiments:
  - id: trace
    type: end_to_end
    enabled: true
    methods: all_enabled
    params:
      delay_scenarios: [task_correlated, task_shuffled]

evaluation:
  probe_samples_per_task: 16
  final_samples_per_task: 64
  window_size: 16
  save_update_norm: true
  probe_on_selected_events: true
  generation_on_selected_checkpoints: true

output:
  save_adapter: true
  save_method_state: true
  overwrite: false
