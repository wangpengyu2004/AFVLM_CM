run:
  seed: 42

training:
  local_epochs: 1
  batch_size: 1
  gradient_accumulation: 4
  learning_rate: 0.00002
  max_text_length: 512
  optimizer: adamw

federation:
  rounds: 10
  mode: asynchronous
  system_profile: null

evaluation:
  protocol: server_global
  interval_unit: server_updates
  eval_every_server_updates: 10
  periodic_split: validation
  final_split: final
  generation_max_new_tokens: 64
  grounding_iou_threshold: 0.5

output:
  directory: runs/afvlm_cm
  overwrite: false
  save_checkpoint: true
  event_log: true
  progress_bar: true
