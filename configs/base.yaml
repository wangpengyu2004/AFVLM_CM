run:
  seed: 42

runtime:
  backend: client_parallel
  # DDP-capable methods use all visible GPUs for one client; step-sensitive methods keep workers.
  executor_policy: capability
  devices: all
  aggregation_device: auto
  start_method: spawn
  startup_timeout_seconds: 1800
  # Covers long VLM generation before the next DDP evaluation collective.
  ddp_timeout_seconds: 7200
  arrival_policy: planned
  worker_queue: plan_arrival_edf

training:
  local_epochs: 1
  batch_size: 1
  gradient_accumulation: 4
  learning_rate: 0.00002
  max_text_length: 512
  optimizer: adamw

federation:
  rounds: 10
  mode: asynchronous
  system_profile: null
  # Intrinsic per-task cost, separate from device speed. Calibrate before final profiles.
  task_compute_factors:
    cls: 1.0
    caption: 1.0
    vqa: 1.0
    chart_vqa: 1.0
    visual_reasoning: 1.0
    grounding: 1.0

evaluation:
  protocol: server_global
  interval_unit: server_updates
  eval_every_server_updates: 10
  periodic_split: validation
  final_split: final
  generation_max_new_tokens: 64
  grounding_iou_threshold: 0.5

output:
  directory: runs/afvlm_cm
  overwrite: false
  save_checkpoint: true
  event_log: true
  progress_bar: true
