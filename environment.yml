name: afvlm-cm

# Reproducible Linux/CUDA environment for the formal LLaVA-1.5-7B runs.
# The PyTorch/CUDA pair follows the official LLaVA v1.1.3 dependency stack.
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip=24.2
  - setuptools>=69
  - wheel
  - git>=2.40
  - numpy=1.26.4
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - pip:
      # Run `conda env create` from the repository root so this editable
      # installation resolves the local AFVLM-CM package and all extras.
      - -e .[llava,data,dev,plots]
