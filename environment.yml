name: afvlm-cm

# Reproducible Linux/CUDA environment for the formal LLaVA-1.5-7B runs.
# Keep the Conda solve intentionally small. The CUDA wheels and Python stack
# are installed by pip so old Conda solvers do not backtrack across channels.
channels:
  - defaults

dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - git
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - numpy==1.26.4
      # Run `conda env create` from the repository root so this editable
      # installation resolves the local AFVLM-CM package and all extras.
      - -e .[llava,data,dev,plots]
