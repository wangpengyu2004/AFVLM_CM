[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afvlm-cm"
version = "0.1.0"
description = "Minimal validation framework for task-conditioned mechanisms in asynchronous federated VLM fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
qwen = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
  "peft>=0.14",
  "pillow>=10.4",
  "qwen-vl-utils>=0.0.10",
  "torch>=2.5",
  "transformers>=4.49",
]
llava = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
  "peft>=0.14",
  "pillow>=10.4",
  "torch>=2.5",
  "transformers>=4.49",
]
plots = [
  "matplotlib>=3.9",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["code", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
