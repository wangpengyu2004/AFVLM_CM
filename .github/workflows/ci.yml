name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static repository validation
        run: |
          python -m compileall -q code scripts tools
          python tools/validate_repository.py --allow_missing_data
      - name: Lint and format
        run: |
          ruff check code scripts tools
          ruff format --check code scripts tools
