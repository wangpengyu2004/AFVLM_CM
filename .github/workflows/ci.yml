name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate config and dry-run
        run: |
          python -m scripts.validate_config --config configs/run.yaml
          python -m scripts.run_experiment --config configs/run.yaml --dry-run > dry-run.json
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest
