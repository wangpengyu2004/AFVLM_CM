run:
  seed: 42
runtime:
  backend: client_parallel
  executor_policy: capability
  devices: all
  aggregation_device: auto
  start_method: spawn
  startup_timeout_seconds: 1800
  ddp_timeout_seconds: 7200
  arrival_policy: planned
  worker_queue: plan_arrival_edf
training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 2.0e-05
  max_text_length: 2048
  optimizer: adamw
  batch_size_scope: reference_ddp
  reference_world_size: 8
federation:
  rounds: 10
  mode: asynchronous
  system_profile: experiment_profiles/hc_r32_e1_bs4_ga4_r10_s42/plans/5clients/system_profile.json
  task_compute_factors:
    cls: 1.0
    caption: 1.0
    vqa: 1.0
    chart_vqa: 1.0
    visual_reasoning: 1.0
    grounding: 1.0
  train_plan: experiment_profiles/hc_r32_e1_bs4_ga4_r10_s42/plans/5clients/async_train_plan.json
evaluation:
  protocol: server_global
  interval_unit: incorporated_client_updates
  eval_every_client_updates: 10
  periodic_split: validation
  final_split: final
  generation_max_new_tokens: 128
  grounding_iou_threshold: 0.5
output:
  directory: runs/llava/afvlm_cm/profiles/hc_r32_e1_bs4_ga4_r10_s42/5clients/aced/seed42
  overwrite: false
  save_checkpoint: true
  event_log: true
  progress_bar: true
model:
  adapter: llava15
  model_path: pretrained/llava-v1.5-7b
  vision_tower_path: pretrained/clip-vit-large-patch14-336
  local_files_only: true
  dtype: fp16
  quantization: none
  device_map: auto
  gradient_checkpointing: true
  conversation_template: v1
  max_new_tokens: 64
  mm_projector_lr: 2.0e-05
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    bias: none
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    train_mm_projector: false
dataset:
  name: afvlm_cm
  clients_per_task: 5
  total_clients: 30
  partition_root: data/AFVLM_CM/partitioned/5_clients
  image_root: data/AFVLM_CM/dataset
  require_images: true
  tasks:
  - cls
  - caption
  - vqa
  - chart_vqa
  - visual_reasoning
  - grounding
method:
  name: aced
  params:
    server_lr: null
    lr_scale: 0.2
    delay_threshold: 10
    cache_bits: 32
    cache_seed: 42
experiment_profile:
  name: hc_r32_e1_bs4_ga4_r10_s42
  immutable_snapshot: true
